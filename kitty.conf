# ==============================================================================
# "ABSOLUTE MONOCHROME" KITTY CONFIGURATION
# A stark, distraction-free black and white environment.
# ==============================================================================

# --- FONTS ---
# A clean monospace font is recommended for the minimal aesthetic.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor

# --- CURSOR ---
# High contrast, solid white block cursor.
cursor                  #ffffff
cursor_text_color       #000000
cursor_shape            block
cursor_blink_interval   0

# --- WINDOW & LAYOUT ---
# Generous padding to let the text breathe; no distracting borders.
window_padding_width    20
hide_window_decorations yes
background_opacity      1.0
confirm_os_window_close 0

# --- TABS ---
# Ultra-minimalist tab bar.
tab_bar_edge            bottom
tab_bar_style           separator
tab_separator           "  |  "
active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold
inactive_tab_foreground #777777
inactive_tab_background #000000
inactive_tab_font_style normal
tab_bar_background      #000000

# ==============================================================================
# THE COLOR PALETTE
# All standard colors are remapped to a black-to-white grayscale gradient.
# ==============================================================================

# Core Colors
# Deep, true black background with crisp, slightly softened white text.
background #000000
foreground #e0e0e0
selection_background #cccccc
selection_foreground #000000

# URL underline color when hovering
url_color #ffffff
url_style single

# The 16 Terminal Colors (ANSI Grayscale Remap)
# This allows syntax highlighting to work by using varying shades of gray
# instead of distracting hues.

# Black / Darkest Gray
color0  #111111
color8  #333333

# Red -> Dark Grays
color1  #555555
color9  #666666

# Green -> Medium Grays
color2  #777777
color10 #888888

# Yellow -> Medium-Light Grays
color3  #999999
color11 #aaaaaa

# Blue -> Light Grays
color4  #bbbbbb
color12 #cccccc

# Magenta -> Lighter Grays
color5  #dddddd
color13 #eeeeee

# Cyan -> Off-Whites
color6  #f4f4f4
color14 #f8f8f8

# White -> Pure White
color7  #ffffff
color15 #ffffff

# ==============================================================================
# PERFORMANCE & NOISE
# ==============================================================================
enable_audio_bell no
visual_bell_duration 0.0
repaint_delay 10
input_delay 3
sync_to_monitor yes
