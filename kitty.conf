# ==============================================================================
# "GENTOO ROSE" KITTY CONFIGURATION
# A minimalist, highly-vibrant monochrome pink/purple aesthetic.
# ==============================================================================

# --- FONTS ---
# A sharp, readable font is essential for a source-based Linux vibe.
# (Make sure you have a Nerd Font installed for icon support, e.g., JetBrainsMono)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures cursor

# --- CURSOR ---
# Extremely vibrant pink to easily track your position in VIM or Nano
cursor                  #ff2a9d
cursor_text_color       #0f0514
cursor_shape            block
cursor_blink_interval   0.5

# --- WINDOW & LAYOUT ---
# Minimalist, sharp window edges with a slight transparency
window_padding_width    10
hide_window_decorations yes
background_opacity      0.95
dynamic_background_opacity yes
confirm_os_window_close 0

# --- TABS ---
# Sleek, Gentoo-esque powerline tabs strictly in our palette
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #0f0514
active_tab_background   #ff2a9d
active_tab_font_style   bold
inactive_tab_foreground #b09fdb
inactive_tab_background #2a1b2e
inactive_tab_font_style normal
tab_bar_background      #0f0514

# --- SCROLLBACK ---
scrollback_lines 10000

# ==============================================================================
# THE COLOR PALETTE
# Standard colors are remapped to shades of pink, purple, and white.
# ==============================================================================

# Core Colors
background #0f0514
foreground #fbf0ff
selection_background #5c3566
selection_foreground #ffffff

# URL underline color when hovering
url_color #e29de6
url_style curly

# The 16 Terminal Colors (ANSI Remap)
# We override the standard rainbow to prevent color interruption.

# Black (Dark Eggplant / Deep Purple)
color0  #1f1025
color8  #4d3356

# Red (Deep Crimson / Vibrant Magenta)
color1  #d14d86
color9  #ff2a9d

# Green (Muted Lavender / Bright Lilac) 
# Usually breaks the pink theme; now mapped to cool purples.
color2  #9e64b0
color10 #c087d1

# Yellow (Warm Rose / Bright Pink-Gold)
# Keeps warnings readable but fits the vibe.
color3  #d67c9c
color11 #f29dbb

# Blue (Deep Violet / Bright Violet)
color4  #7b52ab
color12 #9d75c9

# Magenta (Pure Pink / Electric Pink)
color5  #bd4fb3
color13 #e87ce0

# Cyan (Periwinkle / Cool Lilac)
color6  #8b79b8
color14 #b09fdb

# White (Soft Pink-White / Pure White)
color7  #d9c8db
color15 #f7e6f9

# ==============================================================================
# PERFORMANCE & BELL
# ==============================================================================
enable_audio_bell no
visual_bell_duration 0.0
repaint_delay 10
input_delay 3
sync_to_monitor yes
